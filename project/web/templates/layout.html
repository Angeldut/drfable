{{define "layout"}}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — Трекер трат</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a class="brand" href="/expenses">💰 Трекер трат</a>
      <nav>
        {{if .UserEmail}}
        <a href="/expenses">Список</a>
        <a href="/expenses/new">Добавить</a>
        <span class="user">{{.UserEmail}}</span>
        <form method="POST" action="/logout" class="logout">
          <button type="submit" class="link-button">Выйти</button>
        </form>
        {{else}}
        <a href="/login">Войти</a>
        <a href="/register">Регистрация</a>
        {{end}}
      </nav>
    </div>
  </header>
  <main class="container">
    <h1>{{.Title}}</h1>
    {{template "content" .}}
  </main>
  <footer class="container">Учебный проект · Go</footer>
</body>
</html>{{end}}
