{{define "content"}}
{{if .Expenses}}
<table>
  <thead>
    <tr>
      <th>№</th><th>Дата</th><th>Описание</th><th class="num">Сумма, ₽</th><th></th>
    </tr>
  </thead>
  <tbody>
    {{range .Expenses}}
    <tr>
      <td>{{.ID}}</td>
      <td>{{.Date.Format "02.01.2006"}}</td>
      <td>{{.Description}}</td>
      <td class="num">{{printf "%.2f" .Amount}}</td>
      <td class="actions">
        <a href="/expenses/{{.ID}}/edit">Изменить</a>
        <form method="POST" action="/expenses/{{.ID}}/delete"
              onsubmit="return confirm('Удалить трату «{{.Description}}»?');">
          <button type="submit" class="link-button">Удалить</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
  <tfoot>
    <tr><td colspan="3">Итого</td><td class="num">{{printf "%.2f" .Total}}</td><td></td></tr>
  </tfoot>
</table>
{{else}}
<p class="empty">Трат пока нет. <a href="/expenses/new">Добавить первую</a></p>
{{end}}
{{end}}
